services:
  postgres:
    image: agent-postgres:0.0.1
    build:
      context: .
      dockerfile: postgres.dockerfile
    container_name: agent-postgres
    networks: 
      - default
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agent}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-12qwaszx}
      POSTGRES_PORT: 5432
    expose:
      - 5432
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - agent-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-agent}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    # command: 
    #   - sh -c "/usr/local/bin/init.sh"

  agent:
    image: agent:0.0.1
    build:
      context: ../
      dockerfile: docker/agent.dockerfile
      args:
        env: ${DOCKER_ENV}
    container_name: agent
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-agent}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-12qwaszx}
      PYTHONUNBUFFERED: 1
    networks:
      - default
    depends_on:
      postgres:
        condition: service_healthy
    stdin_open: true
    tty: true
    # Override default command to keep container running (for interactive use)
    command: tail -f /dev/null

networks:
  default:
    driver: bridge

volumes:
  agent-postgres:
